# CDK Mint Daemon — OpenWrt Default Config
# Minimal config for the TollGate bench mint: fakewallet + sqlite.
# The mint is accessible at http://tollgate.lan:8085/
#
# Schema: crates/cdk-mintd/src/config.rs `Settings` at this branch's
# synced cdk version (FORK.md rule: fields re-validated at each re-sync).
# NOTE: since the database-backed config model, this file is NOT a startup
# argument — the init script stages it with `config apply --file` and the
# daemon reads its resolved configuration from the work-dir database.
# `[ln]` no longer exists: backend selection is `[[payment_backend]]`.

[info]
url = "http://tollgate.lan:8085/"
listen_host = "0.0.0.0"
listen_port = 8085
mnemonic = "file:/etc/tollgate/mintd.mnemonic"

[info.quote_ttl]
mint_ttl = 600
melt_ttl = 120

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

[[payment_backend]]
backend = "fakewallet"
unit = "sat"

[database]
engine = "sqlite"

[fake_wallet]
supported_units = ["sat"]
fee_percent = 0.0
reserve_fee_min = 0
min_delay_time = 1
max_delay_time = 3

[limits]
max_inputs = 1000
max_outputs = 1000
