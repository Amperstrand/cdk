# CDK Mint Daemon — OpenWrt Default Config
# Minimal config for TollGate testing: fakewallet + sqlite
# The mint is accessible at http://tollgate.lan:8085/

[info]
url = "http://tollgate.lan:8085/"
listen_host = "0.0.0.0"
listen_port = 8085
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

[info.quote_ttl]
mint_ttl = 600
melt_ttl = 120

[info.http_cache]
backend = "memory"
ttl = 60
tti = 60

[database]
engine = "sqlite"

[ln]
ln_backend = "fakewallet"

[fake_wallet]
supported_units = ["sat"]
fee_percent = 0.0
reserve_fee_min = 0
min_delay_time = 1
max_delay_time = 3

[limits]
max_inputs = 1000
max_outputs = 1000
